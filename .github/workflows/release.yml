name: 'Release to production'

on:
  push:
    tags: ['v*.*.*']

# Repository-scope variables (same in every environment) can live at workflow level.
# Environment-scope ones (project, service accounts, bucket) only resolve inside a job
# that declares `environment:`, so they stay in the jobs.
env:
  GCP_REGION: ${{ vars.GCP_REGION }}
  PUBSUB_TOPIC: ${{ vars.PUBSUB_TOPIC }}
  WIF_POOL_ID: ${{ vars.WIF_POOL_ID }}
  WIF_POOL_PROVIDER: ${{ vars.WIF_POOL_PROVIDER }}
  PROJECT: ${{ vars.PROJECT }}
  STREAM: ${{ vars.STREAM }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GAR_PROJECT_ID }}/${{ vars.PROJECT }}-${{ vars.STREAM }}/${{ vars.PROJECT }}-${{ vars.STREAM }}

jobs:
  ci:
    permissions:
      contents: 'read'
    uses: ./.github/workflows/reusable_wf.yml
    with:
      uv_version: ${{ vars.UV_VERSION }}

  deploy-extract:
    # Cloud Run Job + Cloud Scheduler (runs in parallel with deploy-load)
    environment: prd
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs: ci
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SERVICE_ACCOUNT_GH: ${{ vars.SERVICE_ACCOUNT_GH }}
      GCS_BUCKET: ${{ vars.GCS_BUCKET_NAME }}
      SERVICE_ACCOUNT_EXTRACT: ${{ vars.SERVICE_ACCOUNT_EXTRACT }}

    steps:
    - uses: actions/checkout@v7

    - uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}
        access_token_lifetime: 300s

    - uses: google-github-actions/setup-gcloud@v3

    # The tag must point at the commit dev already built: never rebuild for prd
    - name: Check image
      run: gcloud artifacts docker images describe ${{ env.IMAGE }}:${{ github.sha }}

    - name: Tag release
      run: gcloud artifacts docker tags add ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:${{ github.ref_name }}

    - name: Deploy Cloud Run Job (extract)
      run: |
        gcloud run jobs deploy ${{ env.PROJECT }}-${{ env.STREAM }}-extract \
          --image ${{ env.IMAGE }}:${{ github.sha }} \
          --region ${{ env.GCP_REGION }} \
          --memory 2Gi --cpu 1 \
          --task-timeout 240s --max-retries 0 \
          --service-account ${{ env.SERVICE_ACCOUNT_EXTRACT }} \
          --set-env-vars GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
          --set-env-vars GCS_BUCKET=${{ env.GCS_BUCKET }} \
          --set-env-vars PUBSUB_TOPIC=${{ env.PUBSUB_TOPIC }} \
          --set-env-vars API_MASTER_URL=https://rest.publibike.ch/v1/public/all/stations

    - name: Deploy Cloud Scheduler (every 5 min)
      run: |
        JOB=${{ env.PROJECT }}-${{ env.STREAM }}-extract
        ACTION=$(gcloud scheduler jobs describe $JOB --location ${{ env.GCP_REGION }} >/dev/null 2>&1 && echo update || echo create)
        gcloud scheduler jobs $ACTION http $JOB \
          --location ${{ env.GCP_REGION }} \
          --schedule "*/5 * * * *" --time-zone "Etc/UTC" \
          --uri "https://run.googleapis.com/v2/projects/${{ env.GCP_PROJECT_ID }}/locations/${{ env.GCP_REGION }}/jobs/$JOB:run" \
          --http-method POST \
          --oauth-service-account-email ${{ env.SERVICE_ACCOUNT_EXTRACT }}

  deploy-load:
    # Cloud Function (runs in parallel with deploy-extract)
    environment: prd
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    needs: ci
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
      SERVICE_ACCOUNT_GH: ${{ vars.SERVICE_ACCOUNT_GH }}
      SERVICE_ACCOUNT_LOAD: ${{ vars.SERVICE_ACCOUNT_LOAD }}

    steps:
    - uses: actions/checkout@v7

    - uses: google-github-actions/auth@v3
      with:
        token_format: access_token
        workload_identity_provider: 'projects/${{ env.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.WIF_POOL_ID }}/providers/${{ env.WIF_POOL_PROVIDER }}'
        service_account: ${{ env.SERVICE_ACCOUNT_GH }}
        access_token_lifetime: 300s

    - uses: google-github-actions/setup-gcloud@v3

    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: ${{ vars.UV_VERSION }}

    # Cloud Functions expects main.py + requirements.txt at the root of the source
    - name: Stage function sources
      run: |
        mkdir build_fn
        cp -r src build_fn/src
        cp main_load.py build_fn/main.py
        uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > build_fn/requirements.txt

    - name: Deploy Cloud Function (load)
      run: |
        gcloud functions deploy ${{ env.PROJECT }}-${{ env.STREAM }}-load \
          --gen2 \
          --region ${{ env.GCP_REGION }} \
          --runtime python314 \
          --source build_fn \
          --entry-point load \
          --trigger-topic ${{ env.PUBSUB_TOPIC }} \
          --retry \
          --memory 512Mi \
          --service-account ${{ env.SERVICE_ACCOUNT_LOAD }} \
          --trigger-service-account ${{ env.SERVICE_ACCOUNT_LOAD }} \
          --build-service-account projects/${{ env.GCP_PROJECT_ID }}/serviceAccounts/${{ env.SERVICE_ACCOUNT_GH }} \
          --set-env-vars GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
