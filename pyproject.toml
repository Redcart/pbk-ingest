[project]
name = "pbk-ingest"
version = "0.1.0"
description = "PubliBike data ingestion: API -> GCS -> BigQuery (bronze)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "google-cloud-storage>=3.14.1,<3.15.0",
    "google-cloud-bigquery>=3.45.2,<3.46.0",
    "google-cloud-pubsub>=2.41.0,<2.42.0",
    "pydantic>=2.13.5,<2.14.0",
    "pydantic-settings>=2.15.0,<2.16.0",
    "httpx>=0.28.1,<0.29.0",
    "beautifulsoup4>=4.15.0,<4.16.0",
    "functions-framework>=3.9.2,<3.10.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.13",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration_test: hits real GCP / PubliBike (deselect in CI)"]

[tool.ruff]
extend-exclude = ["archive"]
